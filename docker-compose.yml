# Dobedan HR — Docker Compose (dev)
# Frontend (SPA) Docker DIŞINDA: host'ta `pnpm --filter ... dev` (port 3001/3002/3003)
#
# Kullanım:
#   cp .env.docker.example .env
#   docker compose up -d --build
#   docker compose exec app php artisan key:generate   # APP_KEY yoksa
#   docker compose exec app php artisan migrate:fresh --seed

name: dobedan-hr

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dobedan-hr-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    env_file:
      - .env
    environment:
      # Laravel: container env, mevcut backend/.env üzerine yazılmaz (immutable Dotenv)
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Istanbul}
      APP_LOCALE: ${APP_LOCALE:-tr}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-tr}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-tr_TR}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB:-dobedan_hr}
      DB_USERNAME: ${POSTGRES_USER:-dobedan}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dobedan

  nginx:
    image: nginx:1.27-alpine
    container_name: dobedan-hr-nginx
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - dobedan
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --- Veritabanı: yalnız PostgreSQL 16 ---
  postgres:
    image: postgres:16-alpine
    container_name: dobedan-hr-postgres
    restart: unless-stopped
    # Paralel test: her süreç migrate:fresh'te ~200 tabloyu tek transaction'da düşürür;
    # varsayılan kilit tablosu (64 x max_connections) 8 süreçte taşar.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dobedan_hr}
      POSTGRES_USER: ${POSTGRES_USER:-dobedan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Boş volume'de {POSTGRES_DB}_testing oluşturur (mevcut volume: composer test:db)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - dobedan
  # --- /postgres ---

  redis:
    image: redis:7-alpine
    container_name: dobedan-hr-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dobedan

  queue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dobedan-hr-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:listen --tries=1 --timeout=90
    volumes:
      - ./backend:/var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB:-dobedan_hr}
      DB_USERNAME: ${POSTGRES_USER:-dobedan}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - dobedan

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dobedan-hr-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${POSTGRES_DB:-dobedan_hr}
      DB_USERNAME: ${POSTGRES_USER:-dobedan}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
      REDIS_PORT: ${REDIS_PORT:-6379}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - dobedan

  # --- E2E (Playwright): yalnız `docker compose --profile e2e`; canlı dobedan_hr'ye dokunmaz ---
  # Ayrı veritabanı (*_e2e), ayrı özel dosya kökü, dizi önbellek, senkron kuyruk.
  # Sıfırlama: docker compose exec app-e2e php artisan e2e:reset (DB adı _e2e değilse reddeder)
  app-e2e:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dobedan-hr-app-e2e
    profiles: ["e2e"]
    working_dir: /var/www/html
    # PHP yerleşik sunucusu (çok işçili) + CLI opcache; `artisan serve` alt sürece -d ayarı geçirmez.
    # Laravel server.php yönlendiricisi çalışma dizinini public/ bekler.
    command:
      - sh
      - -c
      - >-
        cd public && exec php -d opcache.enable_cli=1 -d opcache.memory_consumption=256
        -d opcache.max_accelerated_files=30000 -S 0.0.0.0:8000
        ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php
    ports:
      - "${E2E_HTTP_PORT:-8100}:8000"
    volumes:
      - ./backend:/var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: e2e
      APP_DEBUG: "true"
      APP_URL: http://localhost:${E2E_HTTP_PORT:-8100}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Istanbul}
      APP_LOCALE: tr
      APP_FALLBACK_LOCALE: tr
      APP_FAKER_LOCALE: tr_TR
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-dobedan_hr}_e2e
      DB_USERNAME: ${POSTGRES_USER:-dobedan}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_CONNECTION: log
      TELESCOPE_ENABLED: "false"
      LOG_CHANNEL: stderr
      PRIVATE_DISK_ROOT: /var/www/html/storage/app/e2e/private
      # Önbellekler paylaşılan bootstrap/cache'e değil container içine: geliştirme `app`i etkilenmez.
      APP_CONFIG_CACHE: /tmp/e2e-config.php
      APP_ROUTES_CACHE: /tmp/e2e-routes.php
      APP_EVENTS_CACHE: /tmp/e2e-events.php
      CORS_ALLOWED_ORIGINS: http://localhost:4101,http://localhost:4102,http://localhost:4103
      FRONTEND_URL_SUPERADMIN: http://localhost:4101
      FRONTEND_URL_COMPANY: http://localhost:4102
      FRONTEND_URL_PORTAL: http://localhost:4103
      FRONTEND_URL: http://localhost:4102
      PHP_CLI_SERVER_WORKERS: "8"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - dobedan

networks:
  dobedan:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
